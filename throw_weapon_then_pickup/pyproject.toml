[project]
name = "Throw Weapon Then Pickup"
version = "1.0"
authors = [{ name = "Lengyu" }]
description = """
Adds a keybind (default H) that throws your current weapon and then picks it back up immediately, done with internal functions. This is a well-known technique:
1. Instant reload with no reloading animation, Gaige can also reload this way.
2. Instant weapon swap with no holstering animation, e.g. sniper into Lady Fist, Flakker into Ahab, Sand Hawk + Bee into Amigo Sincero.
"""

[project.urls]
Homepage = "https://github.com/aa3615058/Lengyu-BL2-sdk-Mods"

[tool.sdkmod]
license = { name = "GPL3", url = "https://choosealicense.com/licenses/gpl-3.0/" }
name = "Throw Weapon Then Pickup"
coop_support = "ClientSide"
download = "https://raw.githubusercontent.com/aa3615058/Lengyu-BL2-sdk-Mods/main/throw_weapon_then_pickup/throw_weapon_then_pickup.sdkmod"
supported_games = ["BL2", "TPS"]
[project]
name = "Mission Repeatable"
version = "1.4"
authors = [{ name = "Lengyu" }]
description = """
Makes the side missions that reward the following gear repeatable: Fibber, Pimpernel, Swordsplosion, Kitten, Heartbreaker, Rubi, Lady Fist, Amigo Sincero, Hail, Creamer, Evolve Varkid, Chere-amie, Orc, Sand Hawk. Love Thumper and Treasure of the Sands are supported as well.
Every mission can be toggled in the mod options.
About Sand Hawk: Washburne Refinery, C3n50r807, I Know It When I See It - the mission reward is changed to the Sand Hawk, the mission becomes repeatable, and Don't Copy That Floppy no longer requires completing this mission first.
"""

[project.urls]
Homepage = "https://github.com/aa3615058/Lengyu-BL2-sdk-Mods"

[tool.sdkmod]
license = {name = "GPL3", url = "https://choosealicense.com/licenses/gpl-3.0/" }
name = "Mission Repeatable"
coop_support = "HostOnly"
download = "https://raw.githubusercontent.com/aa3615058/Lengyu-BL2-sdk-Mods/main/mission_repeatable/mission_repeatable.sdkmod"
supported_games = ["BL2"]
